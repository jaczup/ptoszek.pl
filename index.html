<!doctype html>
<html>
<head>
  <title>Ptoszek</title>
  <meta charset='UTF-8'>
    <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'avenir next', avenir,
        'helvetica neue', helvetica, ubuntu, roboto, noto, 'segoe ui', arial,
        sans-serif;
      overflow: hidden;
    }
    .hello-message {
      margin: 40px;
      text-align: center;
    }
    .logout-messages {
      pointer-events: none;
      color: red;
      margin: 40px;
      position: fixed;
      top: 0;
      left: 0;
      text-shadow: 2px 2px #FFF, 4px 4px 10px #000;
    }
    img {
      width: 300px;
    }
    @keyframes blurslowly {
      0% {
        filter: none;
      }
      92% {
        filter: blur(0);
      }
      96% {
        filter: blur(1px);
      }
      100% {
        filter: blur(0);
      }
    }
    body {
      animation-name: blurslowly;
      animation-iteration-count: infinite;
      animation-duration: 15s;
      animation-play-state: running;
    }
    .spy-console {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 600px;
      max-height: 85%;
      background: rgba(5, 15, 5, 0.98);
      border: 3px solid #34eb7d;
      box-shadow: 0 0 30px rgba(52, 235, 125, 0.5);
      color: #34eb7d;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 999999;
      display: none;
      border-radius: 10px;
      text-align: left;
    }
    .spy-console h2 {
      margin-top: 0;
      text-align: center;
      text-transform: uppercase;
      border-bottom: 2px dashed #34eb7d;
      padding-bottom: 10px;
      font-size: 22px;
      text-shadow: 0 0 10px #34eb7d;
    }
    .spy-console-line {
      margin: 10px 0;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.4;
    }
    .spy-console-accent {
      color: #ff3333;
      font-weight: bold;
      text-shadow: 0 0 5px #ff3333;
    }
    .spy-console-highlight {
      color: #ffffff;
      font-weight: bold;
      text-shadow: 0 0 5px #ffffff;
    }
    .spy-console-warning {
      margin-top: 20px;
      border: 2px solid #ff3333;
      background: rgba(50, 0, 0, 0.5);
      padding: 15px;
      color: #ff9999;
      font-size: 14px;
      border-radius: 5px;
      line-height: 1.5;
    }
    .spy-console-close {
      display: block;
      margin: 20px auto 0 auto;
      background: #34eb7d;
      color: #000;
      border: none;
      padding: 10px 24px;
      font-family: inherit;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(52, 235, 125, 0.5);
      transition: all 0.2s ease-in-out;
    }
    .spy-console-close:hover {
      background: #20af57;
      transform: scale(1.05);
      box-shadow: 0 0 15px #34eb7d;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="media/images/ptok.jpg">

  <meta property="og:title" content="Ptoszek" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ptoszek.pl" />
  <meta property="og:image" content="https://ptoszek.pl/media/images/ptok.jpg" />
  <meta property="og:description" content="Obejrzyj zdjęcia Ptaków za frytę!" />
  <meta name="keywords" content="ptoszek, ptok, ptoszek.pl, ptok.pl">
  <meta name="description" content="Obejrzyj zdjęcia Ptaków za frytę!">
  <meta name="theme-color" content="#34eb7d">
</head>

    <img src='media/images/intro.gif' alt='Cute ptok' />
  </div>
  <div class='logout-messages'></div>
</template>

<div class="spy-console" id="spyConsole"></div>
